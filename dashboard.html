<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitchPlan — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --grass: #2FA84F; --grass-deep: #1f5f43; --sun: #FFC93C; --coral: #FF6B5E; --sky:#48C6EF; --grape:#9B6BFF;
    --white: #ffffff; --cream: #FFFDF5; --ink: #16281E;
    --ink-soft: rgba(22,40,30,0.62); --line: rgba(22,40,30,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background: var(--cream); font-family:'Inter', sans-serif; color: var(--ink); min-height:100vh; }
  .topbar{
    background: var(--white); padding: 14px 20px; display:flex; align-items:center;
    justify-content:space-between; box-shadow: 0 2px 0 var(--line); position:sticky; top:0; z-index:10;
  }
  .brand{ font-family:'Anton',sans-serif; font-size:20px; text-transform:uppercase; }
  .brand span{ color: var(--grass-deep); }
  .who{ font-size:13px; color: var(--ink-soft); font-weight:600; }
  .signout{
    border:none; background: var(--cream); color: var(--ink); font-weight:700; font-size:12.5px;
    padding:8px 14px; border-radius:9px; cursor:pointer; margin-left:12px;
  }
  .wrap{ max-width:780px; margin:0 auto; padding: 24px 18px 100px; }

  .tabs{ display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .tabbtn{
    border:none; background: var(--white); color: var(--ink-soft); font-weight:800; font-size:13px;
    padding:10px 16px; border-radius:11px; cursor:pointer; box-shadow: 0 3px 0 rgba(0,0,0,0.06);
  }
  .tabbtn.active{ background: var(--grass-deep); color: var(--white); }

  h2{ font-family:'Anton',sans-serif; font-size:22px; text-transform:uppercase; margin: 0 0 4px; }
  .sectionsub{ color: var(--ink-soft); font-size:13px; font-weight:600; margin: 0 0 16px; }

  .stagelegend{
    display:grid; grid-template-columns: 1fr; gap:0; margin-bottom:18px;
    position:relative;
  }
  @media(min-width:600px){ .stagelegend{ grid-template-columns: repeat(4, 1fr); gap:10px; } }
  .stagepath{
    display:none;
  }
  @media(min-width:600px){
    .stagepath{
      display:block; grid-column: 1 / -1; grid-row: 1;
      height:6px; margin: 26px 0 -18px; border-radius:6px;
      background: linear-gradient(90deg, var(--sky), var(--grape), var(--sun), var(--coral));
      position:relative; z-index:0;
    }
  }
  .stagecard{
    border-radius:14px; padding:12px 14px; color: var(--white); cursor:pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12); transition: transform .1s ease;
    position:relative; z-index:1; margin-bottom:8px;
  }
  @media(min-width:600px){ .stagecard{ margin-bottom:0; } }
  .stagecard::before{
    content: attr(data-step);
    position:absolute; top:-9px; left:-9px; width:22px; height:22px; border-radius:50%;
    background: var(--ink); color: var(--white); font-family:'Anton',sans-serif; font-size:11px;
    display:flex; align-items:center; justify-content:center; box-shadow: 0 2px 0 rgba(0,0,0,0.25);
  }
  .stagecard::after{
    content:"→"; position:absolute; right:-16px; top:50%; transform:translateY(-50%);
    color: var(--ink-soft); font-weight:800; font-size:16px; display:none;
  }
  @media(min-width:600px){
    .stagecard:not(:last-child)::after{ display:block; }
  }
  .stagecard:active{ transform: scale(0.98); }
  .stagecard.active{ outline: 3px solid var(--ink); outline-offset:2px; }
  .stagecard.firsttouch{ background: var(--sky); }
  .stagecard.gamesense{ background: var(--grape); }
  .stagecard.goldenage{ background: var(--sun); color: var(--ink); }
  .stagecard.breakthrough{ background: var(--coral); }
  .stagecard .sname{ font-family:'Anton',sans-serif; font-size:16px; text-transform:uppercase; margin:0 0 2px; }
  .stagecard .srange{ font-size:10.5px; font-weight:800; text-transform:uppercase; opacity:0.85; margin:0 0 4px; }
  .stagecard .sblurb{ font-size:11.5px; font-weight:600; line-height:1.4; margin:0; }

  .filters{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .filters select{
    padding:9px 12px; border-radius:10px; border:2px solid var(--line); font-family:'Inter',sans-serif;
    font-size:13px; font-weight:700; color: var(--ink); background: var(--white);
  }

  .drillgrid{ display:grid; grid-template-columns: 1fr; gap:12px; }
  .drillcard{
    background: var(--white); border-radius:16px; padding:14px; box-shadow: 0 5px 0 rgba(0,0,0,0.07);
    display:flex; flex-direction:column; gap:8px;
  }
  .drillcard .tags{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .tag{
    font-size:9.5px; text-transform:uppercase; font-weight:800; letter-spacing:.04em;
    padding:3px 8px; border-radius:7px; background: var(--cream); color: var(--grass-deep);
  }
  .tag.stage{ color: var(--white); }
  .tag.stage.firsttouch{ background: var(--sky); }
  .tag.stage.gamesense{ background: var(--grape); }
  .tag.stage.goldenage{ background: var(--sun); color: var(--ink); }
  .tag.stage.breakthrough{ background: var(--coral); }
  .drillcard h3{ margin:0; font-size:15.5px; }
  .focus{ font-size:11.5px; color: var(--grass-deep); font-weight:700; font-style:italic; margin:0; }
  .drillcard p.desc{ margin:0; font-size:12.5px; color: var(--ink-soft); line-height:1.5; }
  .drillmeta{ font-size:11px; color: var(--ink-soft); font-weight:700; }

  .cardactions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .addbtn{
    border:none; background: var(--sun); color: var(--ink);
    font-weight:800; font-size:12px; padding:7px 12px; border-radius:9px; cursor:pointer;
  }
  .addbtn.added{ background: var(--grass-deep); color: var(--white); }
  .expandbtn{
    border:none; background: none; color: var(--grass-deep); font-weight:800; font-size:12px;
    cursor:pointer; text-decoration:underline; padding:7px 4px;
  }

  .instructions{ background: var(--cream); border-radius:12px; padding:12px 14px; margin-top:4px; }
  .instructions h4{ margin:0 0 6px; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color: var(--grass-deep); }
  .instructions ol{ margin:0 0 12px; padding-left:18px; font-size:12.5px; line-height:1.6; color: var(--ink); }
  .instructions ol:last-child{ margin-bottom:0; }

  .builder{
    background: var(--white); border-radius:18px; padding:16px; box-shadow: 0 6px 0 rgba(0,0,0,0.06);
    margin-bottom:20px;
  }
  .builder .field{ margin-bottom:12px; }
  .builder label{ display:block; font-size:11px; text-transform:uppercase; font-weight:700; color: var(--ink-soft); margin-bottom:5px; }
  .builder input{ width:100%; padding:11px; border-radius:10px; border:2px solid var(--line); font-size:14px; }
  .planlist{ list-style:none; padding:0; margin: 0 0 14px; }
  .planlist li{
    display:flex; justify-content:space-between; align-items:center;
    background: var(--cream); border-radius:10px; padding:9px 12px; margin-bottom:6px; font-size:13px; font-weight:700;
  }
  .planlist button{ border:none; background:none; color: var(--coral); font-weight:800; cursor:pointer; font-size:16px; }
  .savebtn{
    border:none; background: var(--grass-deep); color: var(--white); font-weight:800; font-size:13.5px;
    padding:11px 18px; border-radius:11px; cursor:pointer; width:100%;
  }
  .savebtn:disabled{ opacity:0.4; cursor:not-allowed; }
  .empty{ color: var(--ink-soft); font-size:13px; font-style:italic; }

  .planscard{
    background: var(--white); border-radius:16px; padding:14px 16px; margin-bottom:10px; box-shadow: 0 5px 0 rgba(0,0,0,0.06);
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .planscard .info h3{ margin:0 0 3px; font-size:15px; }
  .planscard .info p{ margin:0; font-size:12px; color: var(--ink-soft); font-weight:600; }
  .delbtn{ border:none; background: var(--cream); color: var(--coral); font-weight:800; font-size:12px; padding:8px 12px; border-radius:9px; cursor:pointer; }

  .addform{ background: var(--white); border-radius:16px; padding:16px; margin-top:8px; }
  .addform .row2{ display:flex; gap:10px; }
  .addform .row2 > *{ flex:1; }
  .toggleform{
    border:none; background:none; color: var(--grass-deep); font-weight:800; font-size:13px; cursor:pointer;
    margin-bottom:10px; text-decoration:underline;
  }

  .loading{ text-align:center; padding: 80px 0; color: var(--ink-soft); font-weight:600; }

  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background: var(--sun); color: var(--ink); font-weight:800; font-size:13px;
    padding:10px 18px; border-radius:12px; z-index:30; box-shadow:0 8px 20px rgba(0,0,0,0.2);
  }
</style>
</head>

      "Add a 'pressure' element: try to complete 20 clean one-touch passes before the timer runs out."
    ]
  },
  {

    duration: 18, equipment: "Cones, bibs, goal, balls, 8+ players",

    soloInstructions: [
      "Set up three cone 'zones' leading toward a goal or target.",
      "Dribble the ball through each zone in turn, taking a few touches in each before advancing — simulating patient build-up.",
      "Finish with a shot on the target from the final zone.",
      "Repeat 8-10 times, varying your angle of approach to the goal each time."
    ]
  },
  {
    name: "Feints & Step-Overs Gauntlet", ageGroup: "U11+", category: "Dribbling",
    duration: 15, equipment: "Cones, bibs, balls, 6+ players",
    focus: "Technique built years earlier now gets tested against real, live defensive pressure.",
    description: "Players run a gauntlet of 1v1 defenders, each requiring a different skill move (step-over, scissor, cut-back) to get past.",
    coachInstructions: [
      "Line up 3-4 defenders in a row, each about 5 yards apart, in a narrow lane.",
      "Assign each defender a fixed role: light passive pressure only, not full tackling.",
      "The attacker must use a different move to beat each defender in sequence.",
      "Rotate attacker and defenders every 2-3 runs.",
      "Coach the fake: 'sell the first move before you go the other way.'"
    ],
    soloInstructions: [
      "Set up 3 cones in a line, about 5 yards apart.",
      "Perform a different move at each cone: step-over at the first, scissor at the second, cut-back at the third.",
      "Do 8-10 full runs, focusing on smoothness over speed at first, then add pace once comfortable."
    ]
  },
  {
    name: "High-Intensity Counter-Press Circuit", ageGroup: "U11+", category: "Possession",
    duration: 18, equipment: "Cones, bibs, balls, 8+ players, timer",
    focus: "The growth-spurt window is when interval-style physical training starts producing real fitness gains.",
    description: "Interval-based small-sided games at high intensity, with players immediately pressing to win the ball back after any loss of possession.",
    coachInstructions: [
      "Set up a small-sided game (4v4) in a tight grid to force quick transitions.",
      "Run in intervals: 3 minutes of high-intensity play, then 1 minute of walking recovery.",
      "Emphasize an immediate counter-press the instant possession is lost — first player to the ball applies pressure.",
      "Repeat for 3-4 rounds.",
      "Track which team wins the ball back fastest most often, as a competitive element."
    ],
    soloInstructions: [
      "Do a 3-minute high-effort dribbling and shooting sequence — dribble hard, shoot, sprint to retrieve the ball, repeat.",
      "Rest 1 minute, walking, then repeat the sequence 3-4 times.",
      "This builds the habit of sprinting to regain the ball immediately after any loose touch."
    ]
  }
];

let currentUser = null;
let allDrills = [];
let myPlans = [];
let currentPlanDrillIds = [];
let expandedDrillIds = new Set();
let activeTab = 'library';
let filterAge = '';
let filterCategory = '';

const app = document.getElementById('app');

function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

async function seedStageDrillsIfNeeded(existingDrills){
  const hasStageDrills = existingDrills.some(d => !!d.focus);
  if (hasStageDrills) return false;
  for (const d of STAGE_DRILLS) {
    await addDoc(collection(db, 'drills'), {
      ...d,
      createdBy: currentUser.uid,
      createdAt: serverTimestamp()
    });
  }
  return true;
}

async function loadDrills(){
  const snap = await getDocs(collection(db, 'drills'));
  allDrills = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function loadMyPlans(){
  const q = query(collection(db, 'practicePlans'), where('coachId', '==', currentUser.uid));
  const snap = await getDocs(q);
  myPlans = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

function render(){
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">⚽ Pitch<span>Plan</span></div>
      <div style="display:flex;align-items:center;">
        <span class="who">${currentUser.email}</span>
        <button class="signout" id="signoutBtn">Sign out</button>
      </div>
    </div>
    <div class="wrap">
      <div class="tabs">
        <button class="tabbtn ${activeTab==='library'?'active':''}" data-tab="library">Drill Library</button>
        <button class="tabbtn ${activeTab==='builder'?'active':''}" data-tab="builder">Build a Plan ${currentPlanDrillIds.length ? `(${currentPlanDrillIds.length})` : ''}</button>
        <button class="tabbtn ${activeTab==='plans'?'active':''}" data-tab="plans">My Plans</button>
      </div>
      <div id="tabContent"></div>
    </div>
  `;
  document.getElementById('signoutBtn').onclick = () => signOut(auth);
  document.querySelectorAll('.tabbtn').forEach(b => {
    b.onclick = () => { activeTab = b.dataset.tab; render(); };
  });
  renderTab();
}

function renderTab(){
  const el = document.getElementById('tabContent');
  if (activeTab === 'library') el.innerHTML = libraryHtml();
  if (activeTab === 'builder') el.innerHTML = builderHtml();
  if (activeTab === 'plans') el.innerHTML = plansHtml();
  wireTabEvents();
}

function libraryHtml(){
  const filtered = allDrills.filter(d =>
    (!filterAge || d.ageGroup === filterAge) &&
    (!filterCategory || d.category === filterCategory)
  );
  return `
    <h2>Drill Library</h2>
    <p class="sectionsub">Four developmental stages, each grounded in what actually works best for that age. Tap a stage to filter, or a drill to see full instructions.</p>
    <div class="stagelegend">
      <div class="stagepath"></div>
      ${AGE_GROUPS.map((age, i) => {
        const s = STAGE_INFO[age];
        const isActive = filterAge === age;
        return `
          <div class="stagecard ${s.key} ${isActive ? 'active' : ''}" data-stagefilter="${age}" data-step="${i + 1}">
            <p class="sname">${s.name}</p>
            <p class="srange">${s.range} · ${age}</p>
            <p class="sblurb">${s.blurb}</p>
          </div>
        `;
      }).join('')}
    </div>
    <div class="filters">
      <select id="filterCategory">
        <option value="">All skills</option>
        ${CATEGORIES.map(c => `<option value="${c}" ${filterCategory===c?'selected':''}>${c}</option>`).join('')}
      </select>
      ${filterAge ? `<button class="tabbtn" id="clearAgeFilter">✕ Clear age filter</button>` : ''}
    </div>
    <div class="drillgrid">
      ${filtered.length === 0 ? `<p class="empty">No drills match those filters.</p>` : filtered.map(drillCardHtml).join('')}
    </div>
    <button class="toggleform" id="toggleAddForm" style="margin-top:16px;">+ Add your own drill</button>
    <div id="addFormWrap"></div>
  `;
}

function drillCardHtml(d){
  const inPlan = currentPlanDrillIds.includes(d.id);
  const isExpanded = expandedDrillIds.has(d.id);
  const stage = STAGE_INFO[d.ageGroup];
  return `
    <div class="drillcard">
      <div class="tags">
        ${stage ? `<span class="tag stage ${stage.key}">${stage.name}</span>` : ''}
        <span class="tag">${d.ageGroup}</span>
        <span class="tag">${d.category}</span>
      </div>
      <h3>${escapeHtml(d.name)}</h3>
      ${d.focus ? `<p class="focus">"${escapeHtml(d.focus)}"</p>` : ''}
      <p class="desc">${escapeHtml(d.description)}</p>
      <div class="drillmeta">⏱ ${d.duration} min &nbsp;·&nbsp; 🧰 ${escapeHtml(d.equipment)}</div>
      <div class="cardactions">
        <button class="addbtn ${inPlan ? 'added' : ''}" data-drillid="${d.id}">${inPlan ? '✓ In Plan' : '+ Add to Plan'}</button>
        ${(d.coachInstructions || d.soloInstructions) ? `<button class="expandbtn" data-expandid="${d.id}">${isExpanded ? 'Hide instructions' : 'How to run this drill'}</button>` : ''}
      </div>
      ${isExpanded ? instructionsHtml(d) : ''}
    </div>
  `;
}

function instructionsHtml(d){
  return `
    <div class="instructions">
      ${d.coachInstructions ? `
        <h4>👨‍🏫 For the coach</h4>
        <ol>${d.coachInstructions.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>
      ` : ''}
      ${d.soloInstructions ? `
        <h4>🏠 Training alone / with a parent</h4>
        <ol>${d.soloInstructions.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ol>
      ` : ''}
    </div>
  `;
}

function builderHtml(){
  const selected = currentPlanDrillIds.map(id => allDrills.find(d => d.id === id)).filter(Boolean);
  const totalTime = selected.reduce((sum, d) => sum + (d.duration || 0), 0);
  return `
    <h2>Build a Practice Plan</h2>
    <p class="sectionsub">Add drills from the Library tab, then save your plan below.</p>
    <div class="builder">
      <div class="field">
        <label>Plan title</label>
        <input type="text" id="planTitle" placeholder="e.g. Week 3 — Golden Age Focus">
      </div>
      ${selected.length === 0 ? `<p class="empty">No drills added yet — head to the Drill Library and tap "+ Add to Plan."</p>` : `
        <ul class="planlist">
          ${selected.map(d => `
            <li>
              <span>${escapeHtml(d.name)} <span style="font-weight:500;color:var(--ink-soft);">· ${d.duration} min</span></span>
              <button data-removeid="${d.id}">✕</button>
            </li>
          `).join('')}
        </ul>
        <p class="sectionsub">Total time: ~${totalTime} min</p>
      `}
      <button class="savebtn" id="savePlanBtn" ${selected.length === 0 ? 'disabled' : ''}>Save Practice Plan</button>
    </div>
  `;
}

function plansHtml(){
  return `
    <h2>My Practice Plans</h2>
    <p class="sectionsub">Plans you've saved. Assignment to teams is coming next.</p>
    ${myPlans.length === 0 ? `<p class="empty">No saved plans yet — build one in the "Build a Plan" tab.</p>` : myPlans.map(p => `
      <div class="planscard">
        <div class="info">
          <h3>${escapeHtml(p.title)}</h3>
          <p>${(p.drillIds || []).length} drills</p>
        </div>
        <button class="delbtn" data-delplan="${p.id}">Delete</button>
      </div>
    `).join('')}
  `;
}

function wireTabEvents(){
  document.querySelectorAll('[data-stagefilter]').forEach(card => {
    card.onclick = () => {
      const age = card.dataset.stagefilter;
      filterAge = (filterAge === age) ? '' : age;
      renderTab();
    };
  });

  const clearBtn = document.getElementById('clearAgeFilter');
  if (clearBtn) clearBtn.onclick = () => { filterAge = ''; renderTab(); };

  const catSel = document.getElementById('filterCategory');
  if (catSel) catSel.onchange = (e) => { filterCategory = e.target.value; renderTab(); };

  document.querySelectorAll('[data-drillid]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.drillid;
      if (!currentPlanDrillIds.includes(id)) {
        currentPlanDrillIds.push(id);
        showToast('Added to plan');
      }
      renderTab();
      updateTabsBadge();
    };
  });

  document.querySelectorAll('[data-expandid]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.expandid;
      if (expandedDrillIds.has(id)) expandedDrillIds.delete(id);
      else expandedDrillIds.add(id);
      renderTab();
    };
  });

  document.querySelectorAll('[data-removeid]').forEach(btn => {
    btn.onclick = () => {
      currentPlanDrillIds = currentPlanDrillIds.filter(id => id !== btn.dataset.removeid);
      renderTab();
      updateTabsBadge();
    };
  });

  const saveBtn = document.getElementById('savePlanBtn');
  if (saveBtn) saveBtn.onclick = async () => {
    const title = document.getElementById('planTitle').value.trim();
    if (!title){ showToast('Give your plan a title first'); return; }
    if (currentPlanDrillIds.length === 0) return;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving…';
    await addDoc(collection(db, 'practicePlans'), {
      coachId: currentUser.uid,
      title,
      drillIds: currentPlanDrillIds,
      createdAt: serverTimestamp()
    });
    currentPlanDrillIds = [];
    await loadMyPlans();
    activeTab = 'plans';
    showToast('Practice plan saved!');
    render();
  };

  document.querySelectorAll('[data-delplan]').forEach(btn => {
    btn.onclick = async () => {
      await deleteDoc(doc(db, 'practicePlans', btn.dataset.delplan));
      await loadMyPlans();
      renderTab();
    };
  });

  const toggleForm = document.getElementById('toggleAddForm');
  if (toggleForm) toggleForm.onclick = () => {
    const wrap = document.getElementById('addFormWrap');
    wrap.innerHTML = wrap.innerHTML ? '' : addFormHtml();
    if (wrap.innerHTML) wireAddForm();
  };
}

function addFormHtml(){
  return `
    <div class="addform">
      <div class="field"><label>Drill name</label><input type="text" id="newName"></div>
      <div class="field"><label>Description</label><input type="text" id="newDesc"></div>
      <div class="row2">
        <div class="field"><label>Age group</label>
          <select id="newAge">${AGE_GROUPS.map(a=>`<option value="${a}">${a}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Skill</label>
          <select id="newCat">${CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        </div>
      </div>
      <div class="row2">
        <div class="field"><label>Duration (min)</label><input type="number" id="newDuration" value="10"></div>
        <div class="field"><label>Equipment</label><input type="text" id="newEquip" placeholder="Cones, balls"></div>
      </div>
      <button class="savebtn" id="createDrillBtn">Add Drill to Library</button>
    </div>
  `;
}

function wireAddForm(){
  document.getElementById('createDrillBtn').onclick = async () => {
    const name = document.getElementById('newName').value.trim();
    if (!name){ showToast('Give the drill a name'); return; }
    const newDrill = {
      name,
      description: document.getElementById('newDesc').value.trim(),
      ageGroup: document.getElementById('newAge').value,
      category: document.getElementById('newCat').value,
      duration: parseInt(document.getElementById('newDuration').value) || 10,
      equipment: document.getElementById('newEquip').value.trim() || 'None',
      createdBy: currentUser.uid,
      createdAt: serverTimestamp()
    };
    await addDoc(collection(db, 'drills'), newDrill);
    await loadDrills();
    document.getElementById('addFormWrap').innerHTML = '';
    renderTab();
    showToast('Drill added to library!');
  };
}

function updateTabsBadge(){
  const b = document.querySelector('.tabbtn[data-tab="builder"]');
  if (b) b.textContent = `Build a Plan ${currentPlanDrillIds.length ? `(${currentPlanDrillIds.length})` : ''}`;
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML;
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = 'index.html'; return; }
  currentUser = user;
  await loadDrills();
  const seeded = await seedStageDrillsIfNeeded(allDrills);
  if (seeded) await loadDrills();
  await loadMyPlans();
  render();
});
</script>
</body>
</html>
